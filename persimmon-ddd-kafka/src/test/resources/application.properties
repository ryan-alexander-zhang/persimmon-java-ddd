spring.application.name=inventory
spring.datasource.url=jdbc:h2:mem:kafka;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:persimmon/db/migration/outbox/h2/V1__persimmon_outbox.sql
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.auto-offset-reset=earliest
persimmon.ddd.outbox.relay-enabled=false
persimmon.ddd.outbox.routes[ordering.*]=ordering.events
persimmon.ddd.kafka.consumer.enabled=true
persimmon.ddd.kafka.consumer.topics=ordering.events
persimmon.ddd.kafka.consumer.retry.max-attempts=1
persimmon.ddd.kafka.consumer.retry.initial-interval=10ms
