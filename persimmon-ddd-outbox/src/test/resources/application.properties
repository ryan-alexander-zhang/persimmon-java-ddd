spring.application.name=shop-monolith
persimmon.ddd.outbox.routes[ordering.OrderShipped]=ordering.events
spring.datasource.url=jdbc:h2:mem:outbox;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:persimmon/db/migration/outbox/h2/V1__persimmon_outbox.sql
persimmon.ddd.outbox.relay-enabled=false
persimmon.ddd.outbox.max-attempts=3
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=outbox
