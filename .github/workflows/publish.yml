name: publish
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github # distributionManagement in pom.xml; GITHUB_ACTOR and GITHUB_TOKEN are the credentials
      - name: a tag names the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false
      - run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: scaffold builds against what was deployed
        run: mvn -B -f scaffold/pom.xml verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
