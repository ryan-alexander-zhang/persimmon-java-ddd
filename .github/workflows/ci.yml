name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: scaffold builds against the modules just built
        run: mvn -B install -DskipTests && mvn -B -f scaffold/pom.xml verify
