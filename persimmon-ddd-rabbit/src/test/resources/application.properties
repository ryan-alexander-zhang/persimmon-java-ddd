spring.application.name=inventory
spring.datasource.url=jdbc:h2:mem:rabbit;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:persimmon/db/migration/outbox/h2/V1__persimmon_outbox.sql
spring.rabbitmq.publisher-confirm-type=correlated
persimmon.ddd.outbox.relay-enabled=false
persimmon.ddd.outbox.routes[ordering.*]=ordering.events
persimmon.ddd.rabbit.consumer.enabled=true
persimmon.ddd.rabbit.consumer.bindings[ordering.events]=ordering.*
persimmon.ddd.rabbit.consumer.retry.max-attempts=1
persimmon.ddd.rabbit.consumer.retry.initial-interval=10ms
